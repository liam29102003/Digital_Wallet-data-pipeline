wallet_dbt:
  target: docker
  outputs:
    docker:
      type: databricks
      catalog: "{{ env_var('BRONZE_CATALOG') }}"
      schema: "{{ env_var('BRONZE_SCHEMA') }}"
      host: "{{ env_var('DATABRICKS_SERVER_HOSTNAME') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      threads: 4
 