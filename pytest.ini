[pytest]
# Ensures the project root (where this file lives) is on sys.path during
# test collection, so `from ingestion.xxx import ...` resolves regardless
# of the current working directory or OS. Without this, pytest's default
# "prepend" import mode inserts tests/ itself onto sys.path instead of the
# project root (since tests/ has no __init__.py), and `ingestion` can't
# be found.
pythonpath = .
testpaths = tests
 