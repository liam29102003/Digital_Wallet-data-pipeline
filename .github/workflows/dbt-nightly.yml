name: dbt nightly build & test

on:
  schedule:
    # 02:00 UTC daily — independent backstop that catches drift even on
    # days with no commits (e.g. Bronze data going stale from a broken
    # Airflow run, with no code change to trigger a build).
    - cron: "0 2 * * *"
  workflow_dispatch:
    # Manual "Run workflow" button in the Actions tab — for ad-hoc checks
    # right after fixing something, without waiting for the cron.

jobs:
  dbt-build-test:
    name: dbt build + test (live warehouse)
    runs-on: ubuntu-latest
    env:
      BRONZE_CATALOG: main
      BRONZE_SCHEMA: bronze
      DATABRICKS_SERVER_HOSTNAME: ${{ secrets.DATABRICKS_SERVER_HOSTNAME }}
      DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dbt
        run: pip install "dbt-databricks>=1.8.0"

      - name: dbt deps
        working-directory: dbt/wallet_dbt
        run: dbt deps || true

      # Checks whether Bronze itself is stale (ingestion silently broken)
      # BEFORE spending time/compute building on top of it. Uses the
      # warn_after/error_after thresholds already defined in sources.yml.
      # continue-on-error: this should surface loudly in the summary but
      # not block the build/test steps below — a stale-but-present source
      # is still worth testing, and we want the full picture in one run
      # rather than stopping at the first signal.
      - name: dbt source freshness
        working-directory: dbt/wallet_dbt
        continue-on-error: true
        run: dbt source freshness --profiles-dir ../../airflow/dbt_profile

      # Mirrors the Airflow DAG's own stage ordering: staging views must
      # exist before snapshot SQL can ref() them, and gold dimensions
      # read from snapshot tables, so snapshot must run before gold.
      - name: dbt run — staging (silver)
        working-directory: dbt/wallet_dbt
        run: dbt run --select tag:silver --profiles-dir ../../airflow/dbt_profile

      - name: dbt snapshot
        working-directory: dbt/wallet_dbt
        run: dbt snapshot --profiles-dir ../../airflow/dbt_profile

      - name: dbt run — gold
        working-directory: dbt/wallet_dbt
        run: dbt run --select tag:gold --profiles-dir ../../airflow/dbt_profile

      - name: dbt test
        working-directory: dbt/wallet_dbt
        # Runs regardless of prior step outcome so a failed build still
        # surfaces whatever test results are possible against what did
        # build — mirrors main.py's own "don't let one failure hide the
        # rest" philosophy.
        if: always()
        run: dbt test --profiles-dir ../../airflow/dbt_profile

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-run-results
          path: |
            dbt/wallet_dbt/target/run_results.json
            dbt/wallet_dbt/target/manifest.json
            dbt/wallet_dbt/target/sources.json
          retention-days: 14