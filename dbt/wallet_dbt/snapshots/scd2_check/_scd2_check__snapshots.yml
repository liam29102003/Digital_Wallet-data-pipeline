version: 2

snapshots:
  - name: branches_snapshot
    description: >
      SCD Type 2 history of stg_branches using the check strategy, since
      the source has no updated_at column. Only branch_name, city,
      country, and region are compared for change detection; ingestion
      metadata columns are excluded to avoid false-positive versions on
      every CSV re-load.
    columns:
      - name: branch_id
        data_tests:
          - not_null
      - name: dbt_valid_from
      - name: dbt_valid_to

  - name: merchants_snapshot
    description: >
      SCD Type 2 history of stg_merchants using the check strategy.
      merchant_name, merchant_category, city, country, and
      merchant_rating are compared for change detection; joined_date is
      immutable and excluded from check_cols.
    columns:
      - name: merchant_id
        data_tests:
          - not_null
      - name: dbt_valid_from
      - name: dbt_valid_to