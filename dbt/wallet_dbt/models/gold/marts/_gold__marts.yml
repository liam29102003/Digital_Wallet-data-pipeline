version: 2

models:
  - name: mart_transaction_daily
    description: >
      Gold-layer daily aggregate mart, built on top of fact_transactions,
      for the Executive Payment Overview Power BI dashboard. Grain is one
      row per (transaction_date, currency, transaction_type, status).
      City and merchant category are intentionally excluded from this
      grain — those cuts should be analyzed directly against
      fact_transactions and its dimensions rather than pre-aggregated
      here. All measures are additive (counts and sums only); ratio
      metrics such as average transaction value and fraud rate are
      deliberately NOT stored and should be computed in Power BI from
      the additive measures (e.g. total_amount / transaction_count).
      Materialized as a full-rebuild table rather than incremental — see
      model file header for why, given fact_transactions' own
      incremental/merge behavior on late-arriving facts.
    columns:
      - name: transaction_date
        description: Calendar date the transaction occurred, derived from fact_transactions.transaction_timestamp.
        data_tests:
          - not_null

      - name: currency
        description: Transaction currency, as recorded on fact_transactions.
        data_tests:
          - not_null

      - name: transaction_type
        description: Transaction type, as recorded on fact_transactions.
        data_tests:
          - not_null

      - name: status
        description: Transaction status, as recorded on fact_transactions.
        data_tests:
          - not_null

      - name: transaction_count
        description: Number of transactions in this date/currency/type/status group.
        data_tests:
          - not_null

      - name: total_amount
        description: Sum of transaction amount for this group. NULL amounts are treated as 0 via COALESCE.
        data_tests:
          - not_null

      - name: total_transaction_fee
        description: Sum of transaction_fee for this group. NULL fees are treated as 0 via COALESCE.
        data_tests:
          - not_null

      - name: total_cashback
        description: Sum of cashback for this group. NULL cashback is treated as 0 via COALESCE.
        data_tests:
          - not_null

      - name: total_loyalty_points
        description: Sum of loyalty_points for this group. NULL values are treated as 0 via COALESCE.
        data_tests:
          - not_null

      - name: fraud_transaction_count
        description: Count of transactions in this group where fraud_flag is true.
        data_tests:
          - not_null

      - name: fraud_amount
        description: >
          Sum of amount for transactions in this group where fraud_flag
          is true. 0 if no fraudulent transactions exist in the group.
        data_tests:
          - not_null

    