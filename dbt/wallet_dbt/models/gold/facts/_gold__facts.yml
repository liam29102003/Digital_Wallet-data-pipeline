version: 2

models:
  - name: fact_transactions
    description: >
      Grain: one row per transaction. The platform's core event fact
      table — no aggregation is applied. Dimension foreign keys are
      resolved via effective-date range joins against
      transaction_timestamp for SCD Type 2 dimensions (wallet, customer,
      merchant), so each transaction correctly references the dimension
      version that was current at the moment the transaction occurred,
      not the dimension's present-day state. Type 1 dimensions (device,
      payment_method) join directly on their natural key. dim_branch is
      not joined — see dim_branch's description for why.

      Schema is contract-enforced: every column below must exist with
      exactly this data_type or the build fails. This is deliberate for
      Gold specifically — Bronze/Silver stay schema-flexible
      (mergeSchema=true) to absorb upstream drift, but this table feeds
      the marts and any downstream BI tool, so an unannounced type
      change here should break the build, not silently reshape what
      consumers are querying.
    config:
      contract:
        enforced: true
    columns:
      - name: transaction_id
        data_type: string
        description: Natural key for the transaction. One row per transaction_id.
        data_tests:
          - unique
          - not_null

      - name: wallet_sk
        data_type: string
        description: >
          Foreign key to dim_wallet, resolved to the wallet version
          effective at transaction_timestamp.
        data_tests:
          - not_null:
              config:
                severity: warn
          - relationships:
              arguments:
                to: ref('dim_wallet')
                field: wallet_sk
              config:
                severity: warn

      - name: customer_sk
        data_type: string
        description: >
          Foreign key to dim_customer, resolved to the customer version
          effective at transaction_timestamp (via the transaction's
          wallet).
        data_tests:
          - not_null:
              config:
                severity: warn
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_sk
              config:
                severity: warn

      - name: merchant_sk
        data_type: string
        description: >
          Foreign key to dim_merchant, resolved to the merchant version
          effective at transaction_timestamp.
        data_tests:
          - not_null:
              config:
                severity: warn
          - relationships:
              arguments:
                to: ref('dim_merchant')
                field: merchant_sk
              config:
                severity: warn

      - name: device_sk
        data_type: string
        description: Foreign key to dim_device.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_device')
                field: device_sk

      - name: payment_method_sk
        data_type: string
        description: Foreign key to dim_payment_method.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_payment_method')
                field: payment_method_sk

      - name: transaction_timestamp
        data_type: timestamp
        description: Timestamp the transaction occurred at the source system. Used as the effective-date join key against SCD Type 2 dimensions.
        data_tests:
          - not_null

      - name: transaction_date
        data_type: date
        description: >
          Date truncation of transaction_timestamp. Used as the Delta
          partition column (see ADR 0009) — exists purely for physical
          layout, not sourced from upstream.
        data_tests:
          - not_null

      - name: status
        data_type: string
        data_tests:
          - accepted_values:
              arguments:
                values: ['Success', 'Failed', 'Pending', 'Reversed']

      - name: transaction_type
        data_type: string

      - name: location_city
        data_type: string

      - name: currency
        data_type: string

      - name: fraud_flag
        data_type: boolean

      - name: amount
        data_type: decimal(18,2)
        description: Transaction amount, decimal(18,2).
      - name: transaction_fee
        data_type: decimal(18,4)
        description: Fee charged on the transaction, decimal(18,4).
      - name: cashback
        data_type: decimal(18,4)
        description: Cashback awarded on the transaction, decimal(18,4).
      - name: loyalty_points
        data_type: int
        description: Loyalty points earned on the transaction.